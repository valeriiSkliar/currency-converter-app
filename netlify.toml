[build]
command = ""
publish = "public-site"

[[redirects]]
from = "/privacy-policy"
to = "/privacy-policy.html"
status = 200

[[redirects]]
from = "/privacy"
to = "/privacy-policy.html"
status = 200

[[redirects]]
from = "/terms"
to = "/terms.html"
status = 200

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
